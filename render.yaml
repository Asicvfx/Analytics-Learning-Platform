# Render blueprint — backend only. DB lives in Supabase, frontend on Vercel.
# In Render: New > Blueprint > pick this repo. Then fill the env vars marked
# sync:false (secrets) in the dashboard.
services:
  - type: web
    name: alp-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        # Render injects the external hostname here at deploy time.
        fromService:
          type: web
          name: alp-backend
          property: host
      # Supabase connection string (Settings > Database > Connection string,
      # use the Session pooler URI). Set in the dashboard.
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_REQUIRE
        value: "true"
      # Your Vercel frontend URL, e.g. https://your-app.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
