# Render blueprint — backend + PostgreSQL (frontend lives on Vercel).
# In Render: New > Blueprint > pick this repo. Render provisions the DB and
# injects its internal DATABASE_URL into the web service automatically.
# Only CORS_ALLOWED_ORIGINS / CSRF_TRUSTED_ORIGINS (the Vercel URL) need filling.
databases:
  - name: alp-db
    plan: free
    databaseName: analytics_platform
    user: alp

services:
  - type: web
    name: alp-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Render also auto-sets RENDER_EXTERNAL_HOSTNAME, which settings.py trusts.
      # The leading-dot wildcard matches any *.onrender.com host.
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      # Internal connection string from the alp-db database above.
      - key: DATABASE_URL
        fromDatabase:
          name: alp-db
          property: connectionString
      # Internal Render network is private — no SSL needed for the DB link.
      - key: DB_SSL_REQUIRE
        value: "false"
      # Your Vercel frontend URL, e.g. https://your-app.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
